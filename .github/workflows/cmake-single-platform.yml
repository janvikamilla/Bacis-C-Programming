name: C Code Compilation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Compile C Programs
        run: |
          for file in *.c; do
            if [ -f "$file" ]; then
              if grep -q "conio.h" "$file"; then
                echo "Skipping $file (Turbo C library)"
                continue
              fi

              echo "Checking $file"
              gcc -fsyntax-only "$file"
            fi
          done

          echo "Compilation checking completed!"
